# Pages CMS (https://pagescms.org): the forms Glenn uses to edit the site.
# Every key in src/content/*.yml must have a field here (tests/unit/pages-config.test.ts).
media:
  input: src/assets/images
  output: /src/assets/images
  extensions: [jpg, jpeg, png, webp]
  rename: safe

components:
  photo:
    type: object
    label: Photo
    fields:
      - name: image
        label: Photo
        type: image
        description: Upload a JPG or PNG. Give the file a clear name first, like "headshot-red-jacket.jpg".
      - name: alt
        label: Describe the photo
        type: string
        description: One short sentence about what's in the photo, for blind visitors and Google.
      - name: title
        label: Caption
        type: string
        description: Only shown in photo galleries, under the photo. Leave empty for no caption.
      - name: description
        label: Longer description
        type: text
        description: Only shown in photo galleries, when someone clicks the photo to see it bigger. Optional.
      - name: focus
        label: Keep in view when cropped
        type: select
        default: center
        description: Photos are cropped to fit. Choose "Top (faces)" for photos where the face is near the top.
        options:
          values:
            - { value: top, label: Top (faces) }
            - { value: center, label: Center }
            - { value: bottom, label: Bottom }
  video:
    type: object
    label: Video
    fields:
      - name: url
        label: Video link
        type: string
        description: Paste the link from the video's Share button on YouTube or Vimeo. Leave empty to hide the video.
        pattern:
          regex: '^$|^(https?://)?(www\.|m\.)?(youtube\.com|youtu\.be|youtube-nocookie\.com|vimeo\.com|player\.vimeo\.com)/\S+$'
          message: That doesn't look like a YouTube or Vimeo link. Copy it from the video's Share button.
      - name: title
        label: Video name
        type: string
        description: 'Read out to blind visitors on the play button, e.g. "Glenn Williams acting reel 2025".'
      - name: thumbnail
        label: Cover photo (optional)
        type: image
        description: Shown before the video plays. YouTube videos use YouTube's own cover if this is empty. Vimeo videos need one.
      - name: start
        label: Start at (seconds)
        type: number
        description: Leave at 0 to play from the start. 2 minutes = 120.
        options:
          min: 0
  link:
    type: object
    label: Link
    fields:
      - name: label
        label: Link text
        type: string
      - name: url
        label: Web address
        type: string
        description: Leave empty to hide the link.
  credit:
    type: object
    label: Credit
    fields:
      - name: role
        label: Role
        type: string
        description: e.g. Puppeteer
      - name: production
        label: Production
        type: string
      - name: director
        label: Director
        type: string
        description: Optional.

content:
  - name: site
    label: Site settings & contacts
    type: file
    format: yaml
    path: src/content/site.yml
    fields:
      - { name: name, label: Your name, type: string }
      - { name: seo_title, label: Title shown in Google and browser tabs, type: string }
      - { name: seo_description, label: Description shown in Google, type: text }
      - { name: share_image, label: Photo shown when the site is shared on social media, type: image }
      - { name: email, label: Public email, type: string }
      - { name: phone, label: Public phone number (leave empty to hide it), type: string }
      - name: socials
        label: Social links (leave empty to hide an icon)
        type: object
        fields:
          - { name: facebook, label: Facebook, type: string }
          - { name: instagram, label: Instagram, type: string }
          - { name: x, label: X (Twitter), type: string }
          - { name: youtube, label: YouTube, type: string }
          - { name: imdb, label: IMDb, type: string }
      - name: agents
        label: Agents
        type: object
        list:
          collapsible:
            collapsed: true
            summary: '{role}: {name}'
        description: Agents are shown on the Contact page.
        fields:
          - { name: role, label: Role, type: string, description: 'e.g. "Agent" or "Voice-over agent"' }
          - { name: name, label: Name, type: string }
          - { name: agency, label: Agency, type: string }
          - { name: logo, label: Agency logo, type: image }
          - { name: phones, label: Phone numbers, type: string, list: true }
          - { name: emails, label: Emails, type: string, list: true }
          - { name: website, label: Website, type: string }

  - name: home
