          - { name: name, label: Your name (big heading), type: string }
          - { name: roles, label: Roles (shown in a row above your name), type: string, list: true }
          - { name: intro, label: Short intro, type: rich-text, options: { format: html, media: false, switcher: false } }
          - { name: union, label: Union line (small text under the intro), type: string }
          - { name: photo, label: Photo, component: photo }
          - { name: primary, label: First button, component: link }
          - { name: secondary, label: Second button, component: link }
