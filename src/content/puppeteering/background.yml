body: |-
  <p>Glenn started young. At 7 and 8 he appeared as a Cub Scout ventriloquist, with a puppet named Terry, on <em>Pete's Place</em>, BCTV's Saturday morning children's show starring ventriloquist Peter Ralston.</p>
  <p>For 10 years he was head puppeteer for the late Bill Terezakis at WCT Productions in Vancouver. He started as the regular puppeteer for the wings of Hawkman on <em>Smallville</em>, and went on to help build the figures, attend production meetings, and organize the puppets and equipment on shoot days, as well as puppeteering them. That work took him to series such as <em>The Twilight Zone</em> and <em>The X-Files</em>, and to Disney's <em>Tomorrowland</em>.</p>
  <p>In 2015 he began puppeteering for SFX Studio in Vancouver, on a Disney TV series and major motion pictures. He brought Joel Echallier's creations to life: crabs that kill, alien babies that crawl and chickens that fly.</p>
