intro: |-
  <p>Glenn Williams is a Vancouver actor, puppeteer, voice-over artist and host with over 50 years in show business. He started at age 7 as a ventriloquist on BCTV's <em>Pete's Place</em>, and has since appeared in numerous television shows and films as an actor and puppeteer.</p>
