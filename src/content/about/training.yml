body: |-
  <p>Glenn performed all through school, acting, announcing and hosting school events, and doing his ventriloquism in talent shows. Through his teens he was a DJ at the teen discotheques.</p>
  <p>He completed the Film and TV Production Studies program at Capilano College, and studied for years under Peter Breck at the Breck Academy of Dramatic Arts in Vancouver. His full list of classes and workshops is on his <a href="https://resumes.actorsaccess.com/GlennWilliams">resume</a>.</p>
  <p>Glenn was also a director, spokesperson and instructor for the Ailanthus Performing Arts Center, a Vancouver inner-city youth performing arts program funded by Bob and Lynda Bentall, Cedar Foundation. It helped youth use the performing arts to make their lives richer.</p>
  <p>His voice-over workshops include:</p>
points:
  - Private voice coaching with Ian Raffel
  - Animation intensive with Bob Bergen, Los Angeles
  - Voice-over workshops with Josanne Lovick and Deb Munroe, Vancouver
