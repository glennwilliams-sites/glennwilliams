body: |-
  <p>Years of ventriloquism, finding a different voice for every puppet, made character voices one of Glenn's specialties. His demos below cover commercials, animation, and TV and radio. AI cannot give the personal, emotional and natural sound of a human voice: Glenn won't sound robotic, and he follows a director's direction to find the feelings AI cannot achieve.</p>
  <p>Recently, Glenn voiced the Pillsbury Doughboy during shooting of the 2024 commercial campaign. To arrange an audition, contact his voice-over agent, Melanie Eng, through the <a href="/contact/">Contact page</a>.</p>
