    body: |-
      <p>Fun fact: Glenn plays a police officer in the scene where musicians trespassing in a warehouse are chased down. It was filmed near the train tracks by the Clarke and 1st Avenue overpass in Vancouver.</p>
      <p>About two minutes in, he is one of the two background cops slipping on fallen apples.</p>
      <p>"Summer of '69" is a June 1985 single by Canadian singer <a href="https://en.wikipedia.org/wiki/Bryan_Adams">Bryan Adams</a>, from his album <em>Reckless</em>.</p>
