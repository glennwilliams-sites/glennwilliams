    body: |-
      <p>Glenn stars as The Puppeteer in <em>Look Up</em>, a micro-short directed by Doug Cook. It was shot in two hours at the 2023 DGC Virtual Production Workshop in Vancouver, run with Virtual Production House, W.F. White and ACTRA, where eight Canadian directors were selected to make virtual production shorts.</p>
      <p>A wise puppeteer interrupts a pursuit of virtual validation: a metaphor for life against the pull of technology.</p>
